name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run, so macOS minutes are not spent twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # Both configurations sign with the local "Dictate Local" certificate, which a runner does not have. Ad-hoc signing is enough to build and test.
      - name: Test
        run: >
          xcodebuild -project Dictate.xcodeproj -scheme Dictate
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build
          CODE_SIGN_IDENTITY=- test

      - name: Release build
        run: >
          xcodebuild -project Dictate.xcodeproj -scheme Dictate
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build
          -configuration Release CODE_SIGN_IDENTITY=- build
