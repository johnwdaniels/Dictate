name: Release

# Pushing a tag such as v1.1.0 builds Dictator, attaches a zipped app to a GitHub release, and names the release after the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Tags look like v1.1 or v1.1.0. Got $TAG." >&2
            exit 1
          fi

      # Tests are signed ad-hoc; only the published app needs the release certificate.
      - name: Test
        run: >
          xcodebuild -project Dictate.xcodeproj -scheme Dictate
          -destination 'platform=macOS,arch=arm64' -derivedDataPath build
          CODE_SIGN_IDENTITY=- test

      # Every release is signed with the same self-signed "Dictate Release" certificate, so macOS sees an update as the
      # same app and keeps its Accessibility permission. Without the secrets the build falls back to ad-hoc and says so.
      - name: Import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.DICTATE_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.DICTATE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_P12" ]; then
            echo "::warning::DICTATE_SIGNING_P12 is not set, so this release is signed ad-hoc and Accessibility will not carry over to the next update."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # A generic destination builds for Apple silicon and Intel in one app. It is built ad-hoc and signed afterward,
      # because a release identity passed to xcodebuild also lands on the KeyboardShortcuts package, which then asks for a team.
      - name: Build
        run: >
          xcodebuild -project Dictate.xcodeproj -scheme Dictate
          -destination 'generic/platform=macOS' -derivedDataPath build
          -configuration Release CODE_SIGN_IDENTITY=-
          MARKETING_VERSION="${TAG#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          build

      - name: Sign
        if: env.SIGN_KEYCHAIN != ''
        run: >
          codesign --force --deep --preserve-metadata=entitlements
          --sign "Dictate Release" --keychain "$SIGN_KEYCHAIN"
          build/Build/Products/Release/Dictator.app

      - name: Package
        run: |
          app=build/Build/Products/Release/Dictator.app
          codesign --verify --strict "$app"
          # The designated requirement names the certificate, which is what lets permissions survive updates.
          codesign --display --requirements - "$app" 2>&1 | grep designated
          lipo -archs "$app/Contents/MacOS/Dictator"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Dictator-$TAG.zip"
          shasum -a 256 "Dictator-$TAG.zip" > "Dictator-$TAG.zip.sha256"

      # Installed copies check appcast.xml on the latest release once a day. Sparkle only installs an update whose
      # EdDSA signature matches the public key in Info.plist, so the feed needs the matching private key.
      - name: Write the update feed
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set, so this release has no appcast.xml and installed copies won't be offered it."
            exit 0
          fi
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          cp "Dictator-$TAG.zip" build/Build/Products/Release/
          scripts/make-appcast.sh "build/Build/Products/Release/Dictator-$TAG.zip" "$TAG" "${{ github.run_number }}" \
            "${{ github.server_url }}/${{ github.repository }}" \
            build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update "$RUNNER_TEMP/sparkle.key"
          rm "$RUNNER_TEMP/sparkle.key"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("Dictator-$TAG.zip" "Dictator-$TAG.zip.sha256")
          if [ -f appcast.xml ]; then assets+=(appcast.xml); fi
          # The release notes come from release-notes/<tag>.md, with GitHub's list of merged pull requests under them.
          notes=()
          if [ -f "release-notes/$TAG.md" ]; then
            notes=(--notes-file "release-notes/$TAG.md")
          else
            echo "::warning::release-notes/$TAG.md is missing, so this release only lists its pull requests."
          fi
          gh release create "$TAG" "${assets[@]}" --title "Dictator $TAG" "${notes[@]}" --generate-notes --verify-tag

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then security delete-keychain "$SIGN_KEYCHAIN"; fi
